<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | IFPR Conecta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <header class="navbar">

        <div class="logo">
            <img src="logoif.png" alt="Logo IFPR Conecta" class="logo-img">
            <strong>IFPR Conecta</strong>
        </div>

        <a href="index.html" class="back-home">
            ← Voltar para o início
        </a>

    </header>


    <main class="login-container">

        <section class="login-card">

            <div class="login-header">
                <img src="logoif.png" alt="Logo IFPR Conecta" class="logo-img">
                <h1>Bem-vindo de volta!</h1>
                <p>
                    Entre na sua conta para continuar
                    encontrando oportunidades.
                </p>

            </div>


            <form id="loginForm">

                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            class="show-password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="login-options">

                    <label class="remember">

                        <input type="checkbox">

                        Lembrar de mim

                    </label>


                    <a href="#">
                        Esqueci minha senha
                    </a>
                </div>  
                <a href="paginainicial.html"><button type="button" class="btn-login-submit">Entrar</button></a>

            </form>
            <div class="login-divider">
                <span>ou</span>
            </div>
            <button class="btn-google">
                <span>
                    G
                </span>
                Continuar com Google
            </button>


            <p class="create-account">

                Ainda não possui uma conta?

                <a href="#">
                    Criar conta
                </a>

            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
